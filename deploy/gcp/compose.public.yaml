# Independent of the engine/inspection app. Never include app.env here.
name: sessionquant-public
services:
  viewer:
    image: sessionquant:local
    command: ["python", "-m", "sessionquant.public_dashboard"]
    env_file: /etc/sessionquant/public.env
    network_mode: host
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
