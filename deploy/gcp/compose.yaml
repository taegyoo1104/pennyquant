name: sessionquant
services:
  db:
    image: mysql:8.4
    env_file: /etc/sessionquant/db.env
    # Single-server Paper: logical backups, no replication or point-in-time recovery.
    command: ["--skip-log-bin", "--max-allowed-packet=64M", "--innodb-buffer-pool-size=128M", "--max-connections=30", "--performance-schema=OFF"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["/var/lib/sessionquant/mysql:/var/lib/mysql"]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 36
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    image: sessionquant:local
    init: true
    network_mode: host
    env_file: /etc/sessionquant/app.env
    volumes: ["/var/lib/sessionquant/app:/app/data"]
    command: ["python", "-m", "sessionquant", "run", "--config", "config/sessionquant.realtime-paper.example.yaml", "--no-desktop-notifications"]
    depends_on:
      db: {condition: service_healthy}
    stop_grace_period: 180s
    # DB/ledger restoration can delay the dashboard listener at startup.
    # A successful probe ends the grace period immediately; failures remain
    # meaningful after it expires. This does not mark trading inputs ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
      start_period: 180s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
