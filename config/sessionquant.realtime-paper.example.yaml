# 실제 시세·뉴스 + 가상 계좌/체결. strict 원장과 분리하여 Paper 가정을 기록한다.
environment: PAPER_LOCAL
database_backend: mysql
db_path: ../data/sessionquant-realtime-paper-v1.db
universe_path: ../data/sp500-universe.json
source: toss
poll_seconds: 2  # 수집 완료 뒤 쉬는 시간. API 호출 제한·재시도 대기는 별도로 유지.
paper_data_policy: observed_paper_v1
actual_account_monitor_enabled: false  # Paper 운영에 실제 계좌 조회는 필요하지 않음
recording_enabled: true
retention:
  enabled: true
  diagnostics_days: 7
  news_days: 30
  # GCP 종료 때 새 백업 업로드 후에만 실행. 분봉·매매·재생·비용 근거는 보존.
  max_seconds: 90
news_enabled: true
strategy: pullback
watchlist_enabled: true
watchlist_size: 50
watchlist_missing_cap_policy: exclude  # 시총 누락 종목 제외; 확인된 시총 범위에서 선정
watchlist_candles_per_cycle: 10
focus_size: 20
market_cap_provider: auto
company_news_refresh_seconds: 180
macro_news_refresh_seconds: 900
candidate_selection:
  enabled: true
  use_news_score: true
  use_sector_score: true
  final_candidate_limit: 5
  quote_alignment_seconds: 2
  # 권장 2종목을 넘기는 실험은 새 실행 공간에서 명시적으로 허용한다.
  allow_above_preferred: false
  # 선택적 제약. 미확인 분산 근거를 안전하다고 간주하지 않는다.
  max_same_sector: null
  max_high_index_correlation: null
  index_correlation_threshold: 0.85
  correlation_minutes: 30
  fail_closed_diversification: true
portfolio:
  initial_cash: '100'
  preferred_positions: 2
  max_positions: 5
  initial_weight: '0.20'
  add_weight: '0.20'
  max_symbol_weight: '0.40'
  max_gross_weight: '0.80'
  risk_per_symbol: '0.0075'
  daily_loss_limit: '0.02'
macro_reference_filter:
  enabled: false
  paper_shadow_only: true
llm_debug_audit:
  enabled: false
macro_context_llm:
  enabled: false

# 일회 진단은 실패 포함 최대 1회. 운영은 아래 예산·호출 한도를 계속 공유한다.
llm:
  primary_model: gpt-4.1-mini
  enable_escalation: false
  format_retry_limit: 0
  daily_primary_call_cap: 45
  hourly_primary_call_cap: 10
  monthly_soft_budget_usd: "2"
  monthly_hard_budget_usd: "3"
