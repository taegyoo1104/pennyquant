[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionquant"
version = "2.1.0"
description = "S&P 500 장중 매매 연구·모의투자·위험 관리 시스템"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1", "websockets>=15,<17", "PyYAML>=6,<7",
  "pandas>=2.2,<4", "numpy>=2,<3", "streamlit>=1.41,<2",
  "exchange-calendars>=4.7,<5", "filelock>=3.16,<4", "PyMySQL[rsa]>=1.1,<2", "python-dotenv>=1,<2", "trafilatura>=2.3,<3", "cryptography>=44,<51"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
sessionquant = "sessionquant.cli:main"
pennyquant = "sessionquant.cli:main"

[tool.setuptools.packages.find]
include = ["sessionquant*", "pennyquant*"]

[tool.setuptools.package-data]
sessionquant = ["_build_info.json", "config/*.yaml", "config/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
